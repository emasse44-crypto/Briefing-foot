name: Build Briefing Commissaire Android 8 APK

on:
  push:
    branches: [main]
    paths:
      - 'android-briefing/**'
      - '.github/workflows/build-briefing-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-briefing
        run: gradle assembleDebug

      - name: Prepare download package
        run: |
          mkdir -p release
          cp android-briefing/app/build/outputs/apk/debug/app-debug.apk release/Briefing-Commissaire-Android8-V1.apk
          cd release
          zip Briefing-Commissaire-Android8-V1.zip Briefing-Commissaire-Android8-V1.apk

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Briefing-Commissaire-Android8-V1
          path: release/Briefing-Commissaire-Android8-V1.zip
          if-no-files-found: error
          retention-days: 30
